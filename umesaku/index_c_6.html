<html>
<head>
    <title>中央配置</title>

    <style>
        .background {
            position: relative;
            width: 700px;
            height: 350px;
            background-color: pink;
        }

        .logo {
            position: absolute;
            width: 450px;
            height: 160px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: aqua;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40px;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="background">
        <div class="logo">ロゴ表示</div>
    </div>
</body>
</html>
