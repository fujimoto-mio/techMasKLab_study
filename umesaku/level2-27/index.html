<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASHION | 自分らしいファッションを楽しむ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>FASHION</h1>

        <button class="menu-button" id="menuButton" type="button"
                aria-label="メニューを開く"
                aria-expanded="false"
                aria-controls="globalNav">
            <span class="menu-icon">☰</span>
            <span class="menu-text">メニュー</span>
        </button>

        <nav id="globalNav">
            <a href="#">HOME</a>
            <a href="#">NEW</a>
            <a href="#">ITEM</a>
            <a href="#">ABOUT</a>
        </nav>
    </header>

    <main>
        <section class="main-visual">
            <img src="image/ダウンロード.jpg" alt="ファッション">
            <h2>NEW STYLE</h2>
            <p>毎日をもっと自分らしく。</p>
        </section>

        <section>
            <h2>NEW ITEMS</h2>
            <p>新しい季節のおすすめアイテム</p>
        </section>

        <section>
            <h2>COORDINATE</h2>
            <p>おすすめのコーディネートをご紹介します。</p>
        </section>

        <section>
            <h2>ABOUT</h2>
            <p>自分らしいファッションを楽しむためのスタイルを提案します。</p>
        </section>
    </main>

    <footer>
        <p>© FASHION</p>
    </footer>

    <script>
        const menuButton = document.getElementById('menuButton');
        const globalNav = document.getElementById('globalNav');
        const menuIcon = document.querySelector('.menu-icon');
        const menuText = document.querySelector('.menu-text');

        menuButton.addEventListener('click', function () {
            const isOpen = globalNav.classList.toggle('open');

            menuButton.setAttribute('aria-expanded', isOpen);

            if (isOpen) {
                menuIcon.textContent = '×';
                menuText.textContent = '閉じる';
                menuButton.setAttribute('aria-label', 'メニューを閉じる');
            } else {
                menuIcon.textContent = '☰';
                menuText.textContent = 'メニュー';
                menuButton.setAttribute('aria-label', 'メニューを開く');
            }
        });
    </script>

</body>
</html>
