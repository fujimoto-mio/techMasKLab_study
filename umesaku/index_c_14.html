<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CSS変数</title>

    <style>
        :root {
            --main-color: #73a4f4;
        }

        .wrapper {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
        }

        .header {
            grid-column: 1 / 7;
            background-color: var(--main-color);
        }

        .content-1 {
            grid-column: 1 / 4;
            background-color: var(--main-color);
        }

        .content-2 {
            grid-column: 4 / 7;
            background-color: var(--main-color);
        }

        .content-3-1 {
            grid-column: 1 / 3;
            background-color: var(--main-color);
        }

        .content-3-2 {
            grid-column: 3 / 5;
            background-color: var(--main-color);
        }

        .content-3-3 {
            grid-column: 5 / 7;
            background-color: var(--main-color);
        }

        .content-4-1 {
            grid-column: 1 / 4;
            background-color: var(--main-color);
        }

        .content-4-2 {
            grid-column: 4 / 7;
            background-color: var(--main-color);
        }

        .footer {
            grid-column: 1 / 7;
            background-color: var(--main-color);
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="header">herder</div>

        <div class="content-1">content-1</div>
        <div class="content-2">content-2</div>

        <div class="content-3-1">content-3-1</div>
        <div class="content-3-2">content-3-2</div>
        <div class="content-3-3">content-3-3</div>

        <div class="content-4-1">content-4-1</div>
        <div class="content-4-2">content-4-2</div>

        <div class="footer">fooder</div>
    </div>
</body>
</html>
